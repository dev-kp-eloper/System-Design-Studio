name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────── Backend ───────────────────
  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./sysdesign-api
        run: mvn clean package -DskipTests

      - name: Run tests
        working-directory: ./sysdesign-api
        env:
          JWT_SECRET: test-secret-key-for-ci-only-32-chars
        run: mvn test -DargLine="-Dnet.bytebuddy.experimental=true"

  # ─────────────────── Frontend ───────────────────
  frontend-ci:
    name: Frontend — Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sysdesign-studio/package-lock.json

      - name: Install dependencies
        working-directory: ./sysdesign-studio
        run: npm ci

      - name: Type check
        working-directory: ./sysdesign-studio
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./sysdesign-studio
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.railway.app

  # ─────────────────── Docker Build Check ───────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t sysdesign-api ./sysdesign-api

      - name: Build frontend image
        run: docker build -t sysdesign-studio ./sysdesign-studio
