spring:
  datasource:
    url: jdbc:h2:mem:sysdesign_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092

app:
  jwt:
    secret: test-secret-key-for-ci-only-32-chars-minimum
    expiration-ms: 3600000
